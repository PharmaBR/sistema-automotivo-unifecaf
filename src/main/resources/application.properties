spring.application.name=sistema-automotivo
server.port=8080

# --- Banco de dados (MySQL) -------------------------------------------------
# Valores padrão para rodar local; no Docker vêm das variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/automotivo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# O modelo físico é o schema.sql (fonte da verdade); o Hibernate NÃO altera tabelas.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Swagger / OpenAPI -----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

