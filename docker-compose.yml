# Sobe MySQL + aplicação com um comando:  docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: automotivo
      MYSQL_USER: automotivo
      MYSQL_PASSWORD: automotivo
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"   # MySQL acessível no host pela porta 3307 (Workbench/DBeaver)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/automotivo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USERNAME: automotivo
      DB_PASSWORD: automotivo
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  db_data:
